name: Windows build and smoke tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore folders for flattened web uploads
        shell: python
        run: |
          from pathlib import Path
          import shutil
          layout = ['assets/palpal-cat/approved-sheet.jpg', 'core/__init__.py', 'core/classifier.py', 'core/engine.py', 'core/messages.py', 'core/settings.py', 'core/storage.py', 'data/classification-rules.json', 'data/messages.json', 'desktop/__init__.py', 'desktop/app.py', 'desktop/bridge.py', 'desktop/launcher.py', 'desktop/smoke.py', 'desktop/windows_activity.py', 'extension/manifest.json', 'extension/options.html', 'extension/options.js', 'extension/worker.js', 'packaging/PalPal.iss', 'packaging/build.ps1', 'packaging/verify-package.ps1', 'tests/extension.test.cjs', 'tests/test_bridge_storage.py', 'tests/test_classifier.py', 'tests/test_desktop_flow.py', 'tests/test_engine.py', 'tests/test_messages.py', 'tests/test_monitor.py', 'tests/test_settings.py', 'tests/test_storage_upgrade.py', 'tests/test_windows_smoke.py', 'tools/browser_smoke.py', 'tools/measure_resources.py']
          for name in layout:
              target = Path(name)
              if target.exists():
                  continue
              source = Path(target.name)
              target.parent.mkdir(parents=True, exist_ok=True)
              if target.name == "__init__.py":
                  target.write_text("")
              elif source.is_file():
                  shutil.copy2(source, target)
              else:
                  raise FileNotFoundError(f"Missing upload: {name} (also checked {source})")
          print("Application folder layout verified.")
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests with real Windows GUI and loopback
        env:
          PALPAL_LIVE_TESTS: '1'
          PALPAL_GUI_TESTS: '1'
        run: python -m unittest discover -s tests -v
      - name: Test extension privacy behavior
        run: node tests/extension.test.cjs
      - name: Install real-browser test tools
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install chromium
      - name: Exercise real extension and desktop flow
        run: python tools/browser_smoke.py
      - name: Install installer compiler
        run: choco install innosetup --yes --no-progress
      - name: Build portable package and installer
        run: ./packaging/build.ps1 -RequireInstaller
      - name: Verify packaged and installed application
        run: ./packaging/verify-package.ps1
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PalPal-Windows
          path: |
            dist/PalPal-portable.zip
            dist/PalPal-Setup.exe
            dist/packaged-smoke.json
            dist/installed-smoke.json
          if-no-files-found: error
      - name: Upload verification reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PalPal-Verification-Reports
          path: |
            reports/*.json
            dist/*smoke.json
          if-no-files-found: ignore
